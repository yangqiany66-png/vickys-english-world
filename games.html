<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Hunter | Vicky's English World</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #20243a;
      min-height: 100vh;
    }

    .topbar {
      height: 70px;
      background: white;
      border-bottom: 1px solid #e8eaf0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
    }

    .back {
      color: #20243a;
      text-decoration: none;
      font-weight: bold;
    }

    .logo {
      font-weight: bold;
      font-size: 20px;
    }

    .game {
      max-width: 760px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .game-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .game-icon {
      font-size: 70px;
      margin-bottom: 10px;
    }

    .game-header h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .game-header p {
      color: #777c8c;
    }

    .progress-box {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
      border: 1px solid #e8eaf0;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: bold;
    }

    .progress {
      height: 10px;
      background: #e8eaf0;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #20243a;
      transition: width 0.3s;
    }

    .question-card {
      background: white;
      border-radius: 25px;
      padding: 35px;
      border: 1px solid #e8eaf0;
      box-shadow: 0 15px 40px rgba(30, 35, 60, 0.08);
    }

    .question-number {
      color: #777c8c;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .word {
      font-size: 42px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0 10px;
    }

    .question {
      text-align: center;
      color: #777c8c;
      margin-bottom: 30px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .option {
      border: 2px solid #e8eaf0;
      background: white;
      border-radius: 15px;
      padding: 18px;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      transition: 0.2s;
    }

    .option:hover {
      transform: translateY(-2px);
      border-color: #20243a;
    }

    .option.correct {
      border-color: #20243a;
      background: #eef0f7;
    }

    .option.wrong {
      border-color: #777;
      background: #f1f1f1;
    }

    .feedback {
      text-align: center;
      margin-top: 25px;
      min-height: 30px;
      font-weight: bold;
    }

    .next {
      display: block;
      width: 100%;
      border: none;
      background: #20243a;
      color: white;
      padding: 15px;
      border-radius: 13px;
      margin-top: 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .result {
      display: none;
      text-align: center;
      background: white;
      border-radius: 25px;
      padding: 45px 25px;
      border: 1px solid #e8eaf0;
    }

    .result-icon {
      font-size: 70px;
      margin-bottom: 15px;
    }

    .result h2 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .result p {
      color: #777c8c;
      line-height: 1.7;
    }

    .reward {
      font-size: 22px;
      font-weight: bold;
      margin: 25px 0;
    }

    .restart,
    .home {
      display: inline-block;
      text-decoration: none;
      border: none;
      background: #20243a;
      color: white;
      padding: 13px 20px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    .home {
      background: #e8eaf0;
      color: #20243a;
    }

    @media (max-width: 600px) {
      .options {
        grid-template-columns: 1fr;
      }

      .word {
        font-size: 34px;
      }

      .question-card {
        padding: 25px 18px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a class="back" href="index.html">← Home</a>
    <div class="logo">🌍 Vicky's English World</div>
  </header>

  <main class="game">

    <div class="game-header">
      <div class="game-icon">🎯</div>
      <h1>Word Hunter</h1>
      <p>Hunt the correct meaning. Earn XP. Level up.</p>
    </div>

    <div class="progress-box">
      <div class="progress-info">
        <span id="progressText">Question 1 / 10</span>
        <span id="scoreText">⭐ 0 XP</span>
      </div>

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>


    <section class="question-card" id="questionCard">

      <div class="question-number" id="questionNumber">
        QUESTION 1
      </div>

      <div class="word" id="word">
        reliable
      </div>

      <div class="question">
        Choose the correct meaning.
      </div>

      <div class="options" id="options"></div>

      <div class="feedback" id="feedback"></div>

      <button class="next" id="nextButton">
        Next Question →
      </button>

    </section>


    <section class="result" id="result">

      <div class="result-icon">🏆</div>

      <h2>Mission Complete!</h2>

      <p id="resultText"></p>

      <div class="reward" id="reward"></div>

      <button class="restart" onclick="restartGame()">
        🔄 Play Again
      </button>

      <a class="home" href="index.html">
        🏠 Home
      </a>

    </section>

  </main>


  <script>

    const questions = [

      {
        word: "reliable",
        options: [
          "可靠的",
          "昂贵的",
          "复杂的",
          "临时的"
        ],
        answer: "可靠的"
      },

      {
        word: "efficiency",
        options: [
          "效率",
          "经验",
          "环境",
          "机会"
        ],
        answer: "效率"
      },

      {
        word: "sustainable",
        options: [
          "可持续的",
          "危险的",
          "传统的",
          "短暂的"
        ],
        answer: "可持续的"
      },

      {
        word: "implement",
        options: [
          "实施",
          "拒绝",
          "解释",
          "减少"
        ],
        answer: "实施"
      },

      {
        word: "interdependence",
        options: [
          "相互依赖",
          "国际贸易",
          "经济增长",
          "社会变化"
        ],
        answer: "相互依赖"
      },

      {
        word: "adapt",
        options: [
          "适应",
          "预测",
          "比较",
          "创造"
        ],
        answer: "适应"
      },

      {
        word: "productivity",
        options: [
          "生产率",
          "人口",
          "价格",
          "收入"
        ],
        answer: "生产率"
      },

      {
        word: "challenge",
        options: [
          "挑战",
          "结果",
          "资源",
          "准备"
        ],
        answer: "挑战"
      },

      {
        word: "opportunity",
        options: [
          "机会",
          "限制",
          "原因",
          "风险"
        ],
        answer: "机会"
      },

      {
        word: "development",
        options: [
          "发展",
          "下降",
          "争议",
          "依赖"
        ],
        answer: "发展"
      }

    ];


    let current = 0;
    let score = 0;
    let answered = false;


    const wordElement = document.getElementById("word");
    const optionsElement = document.getElementById("options");
    const feedbackElement = document.getElementById("feedback");
    const nextButton = document.getElementById("nextButton");
    const progressText = document.getElementById("progressText");
    const scoreText = document.getElementById("scoreText");
    const progressBar = document.getElementById("progressBar");


    function loadQuestion() {

      answered = false;

      const q = questions[current];

      wordElement.textContent = q.word;

      progressText.textContent =
        "Question " + (current + 1) + " / " + questions.length;

      scoreText.textContent =
        "⭐ " + score + " XP";

      progressBar.style.width =
        ((current) / questions.length * 100) + "%";

      feedbackElement.textContent = "";

      nextButton.style.display = "none";

      optionsElement.innerHTML = "";

      q.options.forEach(function(option) {

        const button = document.createElement("button");

        button.className = "option";

        button.textContent = option;

        button.onclick = function() {
          checkAnswer(button, option);
        };

        optionsElement.appendChild(button);

      });

    }


    function checkAnswer(button, option) {

      if (answered) {
        return;
      }

      answered = true;

      const correctAnswer = questions[current].answer;

      const allButtons =
        document.querySelectorAll(".option");

      allButtons.forEach(function(btn) {

        if (btn.textContent === correctAnswer) {
          btn.classList.add("correct");
        }

      });


      if (option === correctAnswer) {

        score += 10;

        button.classList.add("correct");

        feedbackElement.textContent =
          "✅ Correct! +10 XP";

      } else {

        button.classList.add("wrong");

        feedbackElement.textContent =
          "❌ Not quite. The answer is: " + correctAnswer;

      }


      scoreText.textContent =
        "⭐ " + score + " XP";

      nextButton.style.display = "block";

    }


    nextButton.onclick = function() {

      current++;

      if (current >= questions.length) {

        finishGame();

      } else {

        loadQuestion();

      }

    };


    function finishGame() {

      document.getElementById("questionCard").style.display =
        "none";

      document.getElementById("result").style.display =
        "block";

      progressBar.style.width = "100%";

      const correct =
        score / 10;

      document.getElementById("resultText").textContent =
        "You got " + correct + " out of " +
        questions.length + " questions correct.";

      document.getElementById("reward").textContent =
        "⭐ +" + score + " XP   🪙 +" + Math.floor(score / 2) + " Coins";


      let totalXP =
        Number(localStorage.getItem("vicky_xp")) || 0;

      let totalCoins =
        Number(localStorage.getItem("vicky_coins")) || 0;

      totalXP += score;

      totalCoins += Math.floor(score / 2);

      localStorage.setItem("vicky_xp", totalXP);

      localStorage.setItem("vicky_coins", totalCoins);

    }


    function restartGame() {

      current = 0;

      score = 0;

      document.getElementById("questionCard").style.display =
        "block";

      document.getElementById("result").style.display =
        "none";

      loadQuestion();

    }


    loadQuestion();

  </script>

</body>
</html>
